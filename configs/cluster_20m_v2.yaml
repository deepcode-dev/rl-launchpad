# Recovery pilot: preserve a dense reward signal before scaling training.
env_name: "Go1JoystickFlatTerrain"
seed: 10
seeds: [10]
num_envs: 8192
history_len: 1
episode_length: 1000
steps_per_epoch: 163840       # 8192 envs * 20 policy steps
epochs: 305
total_timesteps_per_seed: 49971200
total_timesteps: 49971200
gamma: 0.97
lam: 0.95
clip_ratio: 0.2
pi_lr: 0.0003
anneal_lr: true
target_kl: 0.02
max_grad_norm: 1.0
train_iters: 4
batch_size: 5120
hidden_dim: 512
hidden_sizes: [512, 256, 128]
vf_coef: 0.5

# The stock task clips negative total reward to zero.  Starting at sigma=0.61
# starved the first pilot of signal, while sigma=0.15 keeps most steps positive.
initial_log_std: -1.0
ent_coef: 0.005
ent_coef_final: 0.001
checkpoint_dir: "checkpoints/cluster_20m_v2"
